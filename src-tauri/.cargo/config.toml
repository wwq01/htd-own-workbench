# S3-1 本地 GNU target 编译所需工具链配置
#
# 仅对 x86_64-pc-windows-gnu 生效；CI 用 MSVC target，本段被忽略，无副作用。
# 前提：MinGW-w64 (winlibs) 的 bin 目录已加入 PATH（见 src-tauri/build-tauri.sh）。
# cargo 默认 gnu linker 在本机找不到 cc，显式指向 MinGW 的 triple-prefixed 工具链。
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"

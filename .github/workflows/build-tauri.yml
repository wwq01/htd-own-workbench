name: Build Tauri (Windows)

# 真机编译验证 S3-1 桌面壳：在 windows-latest 上用 MSVC target 跑 `tauri build`，
# 既验证 Rust 骨架能否编译，又产出 NSIS 安装包产物。
# MSVC target 由 runner 预装的 VS Build Tools + Windows SDK 支撑，无需本机那种
# 靠 MinGW 的 GNU 链路，因此 CI 不受本地网络拉取 105MB MinGW 的拖累。
# S4 决策：桌面壳（Tauri）搁置，交付形态改为服务端部署 + 浏览器访问。
# 自动触发会在每次 push 后占用约 8 分钟 CI 且无实际交付物，故改为手动触发
# （Actions 页面 → Build Tauri (Windows) → Run workflow）保留编译验证能力。
on:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# 默认 GITHUB_TOKEN 对 contents 是只读的；失败回传日志需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS (best-effort, for nsis bundling)
        run: winget install --id NSIS.NSIS --exact --accept-source-agreements --silent
        continue-on-error: true

      - name: Frontend deps + build (vite -> frontend/dist)
        run: |
          cd frontend
          npm install
          npm run build

      - name: Backend deps + pkg single-file exe
        run: |
          cd backend
          npm install
          npm run build:win

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Tauri build (cargo compile + nsis bundle)
        shell: bash
        run: |
          tauri build 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      # GitHub 的 Actions 日志与产物下载都要鉴权，本地（无 MinGW）又无法复现编译错误。
      # CI 自己有仓库写权限，故失败时把完整构建日志提交到 ci-logs 分支，
      # 本地 `git fetch origin ci-logs` 即可取出排查。
      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p logs
          if [ -s build.log ]; then cp build.log "logs/build-${GITHUB_RUN_ID}.log"; else echo "(build.log 为空或缺失)" > "logs/build-${GITHUB_RUN_ID}.log"; fi
          git add -f logs/
          git commit -m "ci: build log for run ${GITHUB_RUN_ID}"
          git push --force origin "HEAD:refs/heads/ci-logs"

      - name: Upload NSIS installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: htd-workbench-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

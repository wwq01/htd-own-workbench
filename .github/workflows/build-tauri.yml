name: Build Tauri (Windows)

# 真机编译验证 S3-1 桌面壳：在 windows-latest 上用 MSVC target 跑 `tauri build`，
# 既验证 Rust 骨架能否编译，又产出 NSIS 安装包产物。
# MSVC target 由 runner 预装的 VS Build Tools + Windows SDK 支撑，无需本机那种
# 靠 MinGW 的 GNU 链路，因此 CI 不受本地网络拉取 105MB MinGW 的拖累。
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-tauri.yml'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NSIS (best-effort, for nsis bundling)
        run: winget install --id NSIS.NSIS --exact --accept-source-agreements --silent
        continue-on-error: true

      - name: Frontend deps + build (vite -> frontend/dist)
        run: |
          cd frontend
          npm install
          npm run build

      - name: Backend deps + pkg single-file exe
        run: |
          cd backend
          npm install
          npm run build:win

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Tauri build (cargo compile + nsis bundle)
        run: tauri build

      - name: Upload NSIS installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: htd-workbench-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
